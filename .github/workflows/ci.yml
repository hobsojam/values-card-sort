name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm install  # not npm ci — lock file is generated on Windows

      - name: Build
        run: npm run build
